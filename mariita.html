<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flores Amarillas para Mariita 🌻</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0a12;
    font-family: 'Segoe UI', 'Georgia', serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  #bg {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(255, 215, 0, 0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(255, 200, 0, 0.05) 0%, transparent 50%),
      linear-gradient(180deg, #0a0a12 0%, #12101a 50%, #0a0a12 100%);
    z-index: 0;
  }

  #canvas {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: block;
  }

  #intro {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 20px;
    text-align: center;
    transition: opacity 1.2s ease, visibility 1.2s ease;
  }

  #intro.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  #intro h1 {
    color: #ffe9a8;
    font-size: clamp(1.3rem, 5vw, 2.2rem);
    font-weight: 400;
    letter-spacing: 1px;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    animation: fadeInDown 1.5s ease both;
  }

  #intro p {
    color: rgba(255, 235, 180, 0.7);
    font-size: clamp(0.9rem, 3.5vw, 1.1rem);
    animation: fadeInDown 1.5s ease 0.3s both;
  }

  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #btnMaria {
    position: relative;
    padding: 18px 44px;
    font-size: clamp(1rem, 4vw, 1.3rem);
    font-family: inherit;
    color: #3a2a00;
    background: linear-gradient(135deg, #ffe066, #ffc300, #ffe066);
    background-size: 200% 200%;
    border: none;
    border-radius: 60px;
    cursor: pointer;
    font-weight: 600;
    letter-spacing: 1px;
    box-shadow:
      0 0 25px rgba(255, 200, 0, 0.55),
      0 0 60px rgba(255, 200, 0, 0.25),
      inset 0 0 12px rgba(255, 255, 255, 0.4);
    animation: btnPulse 2.5s ease-in-out infinite, btnGradient 4s ease infinite;
    transition: transform 0.2s ease;
    overflow: hidden;
  }

  #btnMaria::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -60%;
    width: 50%;
    height: 200%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    transform: skewX(-20deg);
    animation: shine 3s ease-in-out infinite;
  }

  @keyframes shine {
    0% { left: -60%; }
    50%, 100% { left: 130%; }
  }

  @keyframes btnPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  @keyframes btnGradient {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  #btnMaria:active { transform: scale(0.96); }

  #message {
    position: fixed;
    inset: 0;
    z-index: 9;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    pointer-events: none;
    opacity: 0;
  }

  #message.show { opacity: 1; }

  #message .line {
    color: #fff4c2;
    text-shadow:
      0 0 15px rgba(255, 215, 0, 0.8),
      0 0 40px rgba(255, 200, 0, 0.5);
    min-height: 1.2em;
  }

  #message .line1 {
    font-size: clamp(1.4rem, 6vw, 2.6rem);
    font-weight: 700;
    letter-spacing: 2px;
  }

  #message .line2 {
    margin-top: 14px;
    color: #ffe066;
    font-size: clamp(1.8rem, 8vw, 3.4rem);
    font-weight: 800;
    letter-spacing: 3px;
    text-shadow:
      0 0 20px rgba(255, 215, 0, 0.9),
      0 0 60px rgba(255, 200, 0, 0.6);
  }

  #message .line3 {
    margin-top: 18px;
    color: rgba(255, 240, 190, 0.85);
    font-size: clamp(0.95rem, 4vw, 1.3rem);
    font-style: italic;
    letter-spacing: 1px;
    text-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
  }

  /* Cursor de máquina de escribir */
  #message .line::after {
    content: '';
  }

  #message.show .line1::after,
  #message.show .line2::after,
  #message.show .line3::after {
    content: '';
  }

  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: #ffe066;
    margin-left: 3px;
    vertical-align: -0.15em;
    animation: blink 0.7s steps(2) infinite;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  .heart-float {
    position: fixed;
    z-index: 2;
    color: rgba(255, 215, 0, 0.25);
    pointer-events: none;
    user-select: none;
    animation: floatHeart linear infinite;
  }

  @keyframes floatHeart {
    0% {
      transform: translateY(0) rotate(0deg) scale(1);
      opacity: 0;
    }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% {
      transform: translateY(-120vh) rotate(360deg) scale(1.3);
      opacity: 0;
    }
  }
</style>
</head>
<body>

<div id="bg"></div>
<canvas id="canvas"></canvas>

<div id="intro">
  <h1>🌻 Un detalle para ti 🌻</h1>
  <p>Presiona el botón, Mariita</p>
  <button id="btnMaria">Para María 💛</button>
</div>

<div id="message">
  <div class="line line1" data-text="Estas flores son para ti"></div>
  <div class="line line2" data-text="Te quiero mucho, Mariita"></div>
  <div class="line line3" data-text="— De parte del Profe Frederick jsjs 💛"></div>
</div>

<script>
(function () {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let W = window.innerWidth;
  let H = window.innerHeight;
  const isMobile = window.innerWidth < 700;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  /* ============================
     PARTÍCULAS AMARILLAS DE FONDO
  ============================ */
  const particles = [];
  const PARTICLE_COUNT = isMobile ? 40 : 70;

  function createParticle() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 2 + 0.6,
      alpha: Math.random() * 0.5 + 0.15,
      speedY: -(Math.random() * 0.25 + 0.08),
      driftX: (Math.random() - 0.5) * 0.3,
      phase: Math.random() * Math.PI * 2,
      twinkle: Math.random() * 0.02 + 0.005
    };
  }

  for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(createParticle());

  function drawParticles(t) {
    for (const p of particles) {
      p.y += p.speedY;
      p.x += p.driftX + Math.sin(t * 0.001 + p.phase) * 0.2;
      p.alpha += Math.sin(t * 0.002 + p.phase) * p.twinkle;
      p.alpha = Math.max(0.08, Math.min(0.7, p.alpha));

      if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
      if (p.x < -10) p.x = W + 10;
      if (p.x > W + 10) p.x = -10;

      ctx.fillStyle = `rgba(255, 235, 150, ${p.alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ============================
     CORAZONES AMARILLOS FLOTANTES
  ============================ */
  const hearts = [];
  const HEART_COUNT = isMobile ? 8 : 14;

  function heartPath(x, y, size) {
    ctx.beginPath();
    const s = size;
    ctx.moveTo(x, y + s * 0.3);
    ctx.bezierCurveTo(x, y, x - s * 0.5, y - s * 0.2, x - s * 0.5, y + s * 0.3);
    ctx.bezierCurveTo(x - s * 0.5, y + s * 0.7, x, y + s * 1.0, x, y + s * 1.3);
    ctx.bezierCurveTo(x, y + s * 1.0, x + s * 0.5, y + s * 0.7, x + s * 0.5, y + s * 0.3);
    ctx.bezierCurveTo(x + s * 0.5, y - s * 0.2, x, y, x, y + s * 0.3);
    ctx.closePath();
  }

  function createHeart() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 8 + 5,
      alpha: Math.random() * 0.18 + 0.08,
      speedY: -(Math.random() * 0.35 + 0.12),
      driftX: (Math.random() - 0.5) * 0.4,
      phase: Math.random() * Math.PI * 2,
      rot: (Math.random() - 0.5) * 0.3,
      rotSpeed: (Math.random() - 0.5) * 0.008
    };
  }

  for (let i = 0; i < HEART_COUNT; i++) hearts.push(createHeart());

  function drawHearts(t) {
    for (const h of hearts) {
      h.y += h.speedY;
      h.x += h.driftX + Math.sin(t * 0.001 + h.phase) * 0.3;
      h.rot += h.rotSpeed;

      if (h.y < -60) { h.y = H + 60; h.x = Math.random() * W; }
      if (h.x < -40) h.x = W + 40;
      if (h.x > W + 40) h.x = -40;

      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(h.rot);
      ctx.globalAlpha = h.alpha;
      ctx.fillStyle = '#ffe066';
      heartPath(0, 0, h.size);
      ctx.fill();
      ctx.restore();
    }
  }

  /* ============================
     PÉTALOS CAYENDO
  ============================ */
  const petals = [];
  const PETAL_COUNT = isMobile ? 16 : 26;

  function createPetal() {
    return {
      x: Math.random() * W,
      y: Math.random() * H - H,
      size: Math.random() * 8 + 6,
      alpha: Math.random() * 0.4 + 0.4,
      speedY: Math.random() * 0.9 + 0.5,
      driftX: (Math.random() - 0.5) * 1.2,
      phase: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.03,
      swayAmp: Math.random() * 1.2 + 0.5,
      hue: 45 + Math.random() * 15
    };
  }

  for (let i = 0; i < PETAL_COUNT; i++) {
    const p = createPetal();
    p.y = Math.random() * H;
    petals.push(p);
  }

  function drawPetals(t) {
    for (const p of petals) {
      p.y += p.speedY;
      p.x += p.driftX + Math.sin(t * 0.001 + p.phase) * p.swayAmp * 0.3;
      p.rot += p.rotSpeed;

      if (p.y > H + 20) {
        p.y = -20;
        p.x = Math.random() * W;
      }
      if (p.x < -20) p.x = W + 20;
      if (p.x > W + 20) p.x = -20;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = `hsla(${p.hue}, 100%, 65%, 1)`;
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();

      // Brillo interior
      ctx.fillStyle = `hsla(${p.hue}, 100%, 85%, 0.6)`;
      ctx.beginPath();
      ctx.ellipse(-p.size * 0.2, -p.size * 0.1, p.size * 0.35, p.size * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  /* ============================
     ESTRELLAS FUGACES
  ============================ */
  const shootingStars = [];
  let nextShootingStar = performance.now() + 4000;

  function spawnShootingStar() {
    const startX = Math.random() * W * 0.6;
    const startY = Math.random() * H * 0.4;
    const angle = Math.PI * 0.25 + (Math.random() - 0.5) * 0.3;
    const speed = 6 + Math.random() * 3;
    shootingStars.push({
      x: startX,
      y: startY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      len: 80 + Math.random() * 80,
      alpha: 1,
      decay: 0.012,
      hue: 48 + Math.random() * 12
    });
  }

  function drawShootingStars(t) {
    if (t > nextShootingStar && shootingStars.length < 3) {
      spawnShootingStar();
      nextShootingStar = t + 5000 + Math.random() * 6000;
    }

    for (let i = shootingStars.length - 1; i >= 0; i--) {
      const s = shootingStars[i];
      s.x += s.vx;
      s.y += s.vy;
      s.alpha -= s.decay;

      if (s.alpha <= 0 || s.x > W + 100 || s.y > H + 100) {
        shootingStars.splice(i, 1);
        continue;
      }

      const tailX = s.x - s.vx * (s.len / 10);
      const tailY = s.y - s.vy * (s.len / 10);

      const grad = ctx.createLinearGradient(tailX, tailY, s.x, s.y);
      grad.addColorStop(0, `hsla(${s.hue}, 100%, 75%, 0)`);
      grad.addColorStop(1, `hsla(${s.hue}, 100%, 85%, ${s.alpha})`);

      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tailX, tailY);
      ctx.lineTo(s.x, s.y);
      ctx.stroke();

      ctx.fillStyle = `hsla(${s.hue}, 100%, 95%, ${s.alpha})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ============================
     ONDAS OPTIMIZADAS AL TOCAR
  ============================ */
  const rippleParticles = [];
  const MAX_RIPPLES = 120;
  const RIPPLE_COUNT = isMobile ? 10 : 16;

  function createRipple(x, y) {
    // Si hay demasiadas, reciclamos las más viejas
    while (rippleParticles.length + RIPPLE_COUNT + 1 > MAX_RIPPLES) {
      rippleParticles.shift();
    }

    const baseSpeed = 2.2;
    for (let i = 0; i < RIPPLE_COUNT; i++) {
      const angle = (Math.PI * 2 / RIPPLE_COUNT) * i + Math.random() * 0.2;
      const speed = baseSpeed * (0.8 + Math.random() * 0.6);
      rippleParticles.push({
        isRing: false,
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r: Math.random() * 2 + 1.2,
        alpha: 1,
        decay: 0.025 + Math.random() * 0.015,
        friction: 0.94,
        hue: 48 + Math.random() * 8
      });
    }

    rippleParticles.push({
      isRing: true,
      x: x,
      y: y,
      radius: 4,
      ringSpeed: 3.5,
      alpha: 0.85,
      decay: 0.03,
      lineWidth: 2
    });
  }

  function drawRipples() {
    for (let i = rippleParticles.length - 1; i >= 0; i--) {
      const p = rippleParticles[i];

      if (p.isRing) {
        p.radius += p.ringSpeed;
        p.ringSpeed *= 0.97;
        p.alpha -= p.decay;
        p.lineWidth *= 0.96;

        if (p.alpha <= 0 || p.lineWidth < 0.4) {
          rippleParticles.splice(i, 1);
          continue;
        }

        ctx.strokeStyle = `rgba(255, 225, 120, ${p.alpha})`;
        ctx.lineWidth = p.lineWidth;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.stroke();
        continue;
      }

      p.x += p.vx;
      p.y += p.vy;
      p.vx *= p.friction;
      p.vy *= p.friction;
      p.alpha -= p.decay;

      if (p.alpha <= 0) {
        rippleParticles.splice(i, 1);
        continue;
      }

      ctx.fillStyle = `hsla(${p.hue}, 100%, 75%, ${p.alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ============================
     FLORES AMARILLAS CON VIENTO
  ============================ */
  const flowers = [];
  const FLOWER_COUNT = isMobile ? 14 : 22;

  function createFlower() {
    return {
      baseX: Math.random() * W,
      baseY: Math.random() * H,
      x: 0, y: 0,
      size: Math.random() * 16 + 12,
      petals: Math.floor(Math.random() * 3) + 6,
      stemHeight: Math.random() * 70 + 50,
      phase: Math.random() * Math.PI * 2,
      swaySpeed: Math.random() * 0.0008 + 0.0004,
      swayAmp: Math.random() * 25 + 12,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.0004,
      hueShift: Math.random() * 20 - 10,
      alpha: Math.random() * 0.35 + 0.65,
      bloom: 0,
      targetBloom: 1
    };
  }

  function drawFlower(f, t, windX) {
    const sway = Math.sin(t * f.swaySpeed + f.phase) * f.swayAmp;
    const sway2 = Math.sin(t * f.swaySpeed * 2.3 + f.phase * 1.7) * (f.swayAmp * 0.25);
    const windOffset = windX * (f.size * 0.25);

    f.x = f.baseX + sway + sway2 + windOffset;
    f.y = f.baseY;

    if (f.bloom < f.targetBloom) {
      f.bloom += 0.008;
      if (f.bloom > f.targetBloom) f.bloom = f.targetBloom;
    }

    const scale = f.bloom;
    const size = f.size * scale;
    if (scale <= 0.01) return;

    ctx.save();
    ctx.globalAlpha = f.alpha * scale;
    ctx.strokeStyle = 'rgba(120, 160, 60, 0.85)';
    ctx.lineWidth = 2.2 * scale;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(f.x, f.y);
    const stemSway = Math.sin(t * f.swaySpeed + f.phase) * 6;
    ctx.quadraticCurveTo(
      f.x + stemSway * 0.5,
      f.y + f.stemHeight * 0.5,
      f.x + stemSway,
      f.y + f.stemHeight
    );
    ctx.stroke();

    ctx.fillStyle = 'rgba(110, 150, 55, 0.8)';
    ctx.beginPath();
    ctx.ellipse(f.x + stemSway * 0.3 - 8, f.y + f.stemHeight * 0.45, 9 * scale, 4 * scale, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(f.x + stemSway * 0.7 + 8, f.y + f.stemHeight * 0.68, 8 * scale, 3.5 * scale, 0.5, 0, Math.PI * 2);
    ctx.fill();

    const cx = f.x + stemSway;
    const cy = f.y + f.stemHeight;
    const petalRadius = size * 0.55;
    const centerRadius = size * 0.28;

    f.rot += f.rotSpeed;
    ctx.fillStyle = `hsla(${50 + f.hueShift}, 100%, 62%, ${0.95 * scale})`;
    for (let i = 0; i < f.petals; i++) {
      const angle = (Math.PI * 2 / f.petals) * i + f.rot;
      const px = cx + Math.cos(angle) * petalRadius;
      const py = cy + Math.sin(angle) * petalRadius;
      ctx.beginPath();
      ctx.ellipse(px, py, size * 0.45, size * 0.28, angle, 0, Math.PI * 2);
      ctx.fill();
    }

    const centerGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, centerRadius);
    centerGrad.addColorStop(0, `rgba(255, 245, 180, ${scale})`);
    centerGrad.addColorStop(0.5, `rgba(255, 200, 40, ${0.95 * scale})`);
    centerGrad.addColorStop(1, `rgba(200, 140, 0, ${0.8 * scale})`);
    ctx.fillStyle = centerGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, centerRadius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = `rgba(120, 80, 0, ${0.6 * scale})`;
    for (let i = 0; i < 5; i++) {
      const a = (Math.PI * 2 / 5) * i + f.rot * 0.5;
      const rr = centerRadius * 0.5;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, 1.2 * scale, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function initFlowers() {
    flowers.length = 0;
    for (let i = 0; i < FLOWER_COUNT; i++) {
      const f = createFlower();
      f.baseY = H * 0.35 + Math.random() * H * 0.55;
      f.baseX = Math.random() * W;
      flowers.push(f);
    }
  }

  /* ============================
     BUCLE DE ANIMACIÓN
  ============================ */
  let animating = false;
  let windTime = 0;

  function animate(t) {
    windTime += 0.01;
    const windX = Math.sin(windTime * 0.7) * 0.8 + Math.sin(windTime * 1.9) * 0.3;

    ctx.clearRect(0, 0, W, H);

    drawParticles(t);
    drawHearts(t);
    drawPetals(t);
    drawShootingStars(t);
    drawRipples();

    if (animating) {
      for (const f of flowers) drawFlower(f, t, windX);
    }

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);

  /* ============================
     INTERACCIÓN: BOTÓN
  ============================ */
  const intro = document.getElementById('intro');
  const message = document.getElementById('message');
  const btn = document.getElementById('btnMaria');

  btn.addEventListener('click', function () {
    intro.classList.add('hidden');
    animating = true;
    initFlowers();

    setTimeout(function () {
      message.classList.add('show');
      startTypewriter();
    }, 800);

    if (navigator.vibrate) navigator.vibrate([30, 40, 60]);
  });

  /* ============================
     EFECTO MÁQUINA DE ESCRIBIR
  ============================ */
  function typeLine(el, text, speed, onDone) {
    let i = 0;
    el.textContent = '';
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    el.appendChild(cursor);

    function step() {
      if (i < text.length) {
        cursor.insertAdjacentText('beforebegin', text.charAt(i));
        i++;
        setTimeout(step, speed);
      } else {
        setTimeout(function () {
          cursor.remove();
          if (onDone) onDone();
        }, 500);
      }
    }
    step();
  }

  function startTypewriter() {
    const l1 = document.querySelector('.line1');
    const l2 = document.querySelector('.line2');
    const l3 = document.querySelector('.line3');

    l1.textContent = '';
    l2.textContent = '';
    l3.textContent = '';

    setTimeout(function () {
      typeLine(l1, l1.dataset.text, 70, function () {
        setTimeout(function () {
          typeLine(l2, l2.dataset.text, 90, function () {
            setTimeout(function () {
              typeLine(l3, l3.dataset.text, 55);
            }, 300);
          });
        }, 300);
      });
    }, 400);
  }

  /* ============================
     ONDAS AL TOCAR / CLIC
  ============================ */
  function handleTap(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    createRipple(clientX - rect.left, clientY - rect.top);
    if (navigator.vibrate) navigator.vibrate(10);
  }

  window.addEventListener('mousedown', function (e) {
    handleTap(e.clientX, e.clientY);
  });

  window.addEventListener('touchstart', function (e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
      const touch = e.changedTouches[i];
      handleTap(touch.clientX, touch.clientY);
    }
  }, { passive: true });

  /* ============================
     CORAZONES DECORATIVOS EN EL DOM
  ============================ */
  function spawnDomHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart-float';
    heart.textContent = '💛';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.bottom = '-10vh';
    heart.style.fontSize = (Math.random() * 20 + 14) + 'px';
    heart.style.animationDuration = (Math.random() * 12 + 14) + 's';
    heart.style.animationDelay = Math.random() * 8 + 's';
    document.body.appendChild(heart);

    setTimeout(function () { heart.remove(); }, 30000);
  }

  for (let i = 0; i < 8; i++) setTimeout(spawnDomHeart, i * 1200);
  setInterval(spawnDomHeart, 3500);

})();
</script>
